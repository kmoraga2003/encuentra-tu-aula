<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remote Waters · Prototipo web</title>
<style>
:root{--navy:#0b3a5b;--teal:#0f8b8d;--cyan:#1ea5d0;--bg:#ffffff;--card:#fff;--soft:#e8f4f5;--tx:#16384f;--mut:#5b7688;--bd:#d6e6ea;--ink:#fff;--err:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#8fd3ea;--teal:#38b2b0;--cyan:#3fb6e0;--bg:#0a1c28;--card:#10293a;--soft:#12313f;--tx:#e3f0f5;--mut:#93aebc;--bd:#1f4256;--ink:#06202e;--err:#ff8a7a}}
:root[data-theme="dark"]{--navy:#8fd3ea;--teal:#38b2b0;--cyan:#3fb6e0;--bg:#0a1c28;--card:#10293a;--soft:#12313f;--tx:#e3f0f5;--mut:#93aebc;--bd:#1f4256;--ink:#06202e;--err:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif}
h1,h2,h3{margin:0;line-height:1.15;color:var(--navy)}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:700}
h3{font-size:1.1rem}
p{margin:.5rem 0}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:20px;min-height:72px}
.logo{display:flex;align-items:center;text-decoration:none}
.logo img{height:40px;width:auto;display:block}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav a{padding:8px 11px;text-decoration:none;font-size:.9rem;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{color:var(--navy);font-weight:600;border-color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:99px;border:2px solid transparent;background:var(--navy);color:var(--ink);font:600 .92rem inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn.teal{background:var(--teal)}.btn.cyan{background:var(--cyan)}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--navy)}
.btn.wh{background:#fff;color:#0b3a5b}
.btn.wl{background:transparent;color:#fff;border-color:#fff}
.btn.sm{padding:8px 16px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 112px)}
.half{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:48px clamp(24px,5vw,72px);color:#fff;overflow:hidden}
.half h1{color:#fff;font-size:clamp(1.8rem,3.6vw,2.8rem);text-transform:uppercase;letter-spacing:.02em}
.half p{max-width:44ch}
.half.a{background:linear-gradient(170deg,#0b3a5b 0%,#1273a8 55%,#0a2f4d 100%)}
.half.b{background:linear-gradient(160deg,#0b5a4a 0%,#0f8b6d 45%,#0a3f3a 100%)}
.half svg.bg{position:absolute;inset:auto 0 0 0;width:100%;opacity:.18;pointer-events:none}
.half>*{position:relative}
.half .ico{width:46px;height:46px}
.rule{width:44px;height:3px;background:var(--cyan)}
.fq{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.14)}.fq b{font-size:1rem}
.fin{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px;text-align:left}.fin h3{color:var(--mut);text-align:center;margin-bottom:12px}.fin ul{margin:0;padding-left:18px;font-size:.93rem}.fin li{padding:2px 0}
.hero2{background:linear-gradient(120deg,#0b3a5b,#1273a8);color:#fff;padding:60px 0}
.hero2.g{background:linear-gradient(120deg,#0b5a4a,#0f8b6d)}
.hero2 .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero2 h1{color:#fff;text-transform:uppercase}.hero2 p{max-width:50ch;opacity:.94}
.plant{aspect-ratio:4/3;border-radius:18px;background:linear-gradient(180deg,#bfe3f3 0%,#7fb8d3 45%,#2c7ba3 46%,#124e73 100%);display:grid;place-items:center;overflow:hidden}
section{padding:54px 0}
.alt{background:var(--bg);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.ctr{text-align:center}
.sub{color:var(--mut);margin:6px 0 0}
.grid{display:grid;gap:18px;margin-top:26px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px}
.card p{color:var(--mut);font-size:.93rem}
.eyebrow{color:var(--teal);font-size:.85rem;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.hero2 .eyebrow{color:#bdeeee}
.cta{display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px 26px;margin-top:30px}
.bgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:38px 20px;margin-top:36px}
.bi{flex:0 0 calc(33.33% - 14px);text-align:center;padding:0 8px}
.bi svg{width:58px;height:58px;display:block;margin:0 auto 12px}
.bi p{font-weight:700;color:var(--mut);margin:0;font-size:.92rem}
.bi.u{flex-basis:calc(33.33% - 14px)}
.bi.u h3{color:var(--mut);font-size:1.05rem;margin-bottom:8px}
.bi.u p{font-weight:400;font-size:.88rem;margin:0 0 .8em}
.bgrid.two .bi{flex-basis:calc(40% - 14px)}
.use{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px;text-align:center}
.use img{height:150px;width:auto;max-width:100%;object-fit:contain;display:block;margin:0 auto 14px}
.use b{display:block;color:var(--navy);font-size:.95rem;letter-spacing:.03em}
.use span{font-size:.88rem;color:var(--mut)}
.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.flow span{padding:8px 16px;border-radius:99px;background:var(--soft);color:var(--navy);font-weight:600;font-size:.9rem}
.flow i{color:var(--teal);font-style:normal}
.fcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.fcard svg{width:84px;height:84px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bd);background:var(--card);color:var(--navy);font-size:1.2rem;cursor:pointer;line-height:1}
.qty output{min-width:2ch;text-align:center;font-weight:700;color:var(--navy);font-size:1.1rem}
.inc{color:var(--teal);font-weight:600;min-height:1.3em}
.prog{display:flex;gap:6px;margin:12px 0}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--bd)}.prog i.d{background:var(--teal)}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px;color:var(--tx)}
label .rq{color:var(--err)}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:11px 12px;border-radius:6px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
input.bad{border-color:var(--err)}
fieldset{border:0;padding:0;margin:26px 0 0}
legend{padding:0;font-weight:600;color:var(--tx);margin-bottom:8px}
.ck{display:flex;align-items:center;gap:10px;font-weight:400;margin:0;padding:7px 4px;cursor:pointer;border-radius:8px}
.ck:hover{background:var(--soft)}
.ck input{width:20px;height:20px;accent-color:var(--teal);flex:none;margin:0}
.oth{display:none;margin:2px 0 6px 34px;width:calc(100% - 34px)}
.oth.on{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px}
.note{background:var(--soft);border-left:4px solid var(--teal);padding:14px 18px;border-radius:8px;color:var(--mut);font-size:.92rem}
.ferr{color:var(--err);font-weight:600;min-height:1.4em;margin-top:14px}
.pc{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-size:.85rem;color:var(--mut);background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;display:inline-block;margin-top:18px}
.sum{list-style:none;padding:0;margin:14px 0;text-align:left}.sum li{padding:8px 0;border-bottom:1px solid var(--bd)}.sum b{color:var(--navy)}
.stars{display:flex;gap:6px}.stars button{font-size:2rem;background:none;border:0;cursor:pointer;color:var(--bd);padding:0}.stars button.on{color:#e8a915}
.tl{border-left:3px solid var(--teal);padding-left:18px;margin:18px 0}.tl div{margin-bottom:14px}.tl b{color:var(--navy)}
.kpis{display:flex;gap:36px;flex-wrap:wrap;margin:18px 0}.kpis b{display:block;font-size:1.6rem;color:var(--navy)}.kpis small{color:var(--mut)}
.ci{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.ci .qty button{width:30px;height:30px;font-size:1rem}
.lk{background:none;border:0;color:var(--teal);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
dialog{border:1px solid var(--bd);border-radius:16px;padding:22px;width:min(460px,92vw);background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(5,25,40,.55)}
dialog h3{margin-bottom:6px}
.cc{display:flex;justify-content:space-between;align-items:center}
.cc button{background:none;border:0;font-size:1.6rem;color:var(--mut);cursor:pointer}
.cartbtn{position:relative}
footer{background:#0b2a40;color:#cfe3ee;padding:32px 0;font-size:.88rem;margin-top:30px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.proto{background:var(--navy);color:var(--ink);text-align:center;font-size:.8rem;padding:5px}
.chip{background:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{background:#fff;border-radius:10px;padding:4px 8px}}
:root[data-theme="dark"] .chip{background:#fff;border-radius:10px;padding:4px 8px}
@media (max-width:820px){
 .split,.hero2 .wrap,.g2,.g3,.use,.fin{grid-template-columns:1fr}
 .split{min-height:0}.half{min-height:56vh}
 .bar{flex-wrap:wrap;padding:10px 0;gap:8px}
 nav{margin:0;order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}
 .cartbtn{margin-left:auto}
 .bi,.bi.u,.bgrid.two .bi{flex-basis:calc(50% - 12px)}
}
@media (max-width:520px){.bi,.bi.u,.bgrid.two .bi{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Precios */
.prices-wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.prices-row{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;align-items:stretch;justify-content:center;margin-top:36px}
.prices-row-3{display:grid;grid-template-columns:repeat(3,280px);gap:32px;align-items:stretch;justify-content:center;margin-top:48px}
.prices-col{display:flex;flex-direction:column;align-items:center;height:100%}
.prices-card{width:100%;height:100%;min-height:580px;border-radius:22px;padding:26px 18px 22px;display:flex;flex-direction:column;box-sizing:border-box}
.prices-card.service{min-height:460px}
.prices-card.blue{background-color:#1ea5d0;color:#ffffff;border:2.5px solid #1ea5d0}
.prices-card.white{background-color:#ffffff;color:#1ea5d0;border:2.5px solid #1ea5d0}
.prices-card.navy{background-color:#ffffff;color:#1ea5d0;border:2.5px solid #0b3a5b}
.prices-card .picon-wrap{width:64px;height:64px;margin:0 auto 12px;display:grid;place-items:center}
.prices-card h3{font-size:1.25rem;line-height:1.25;text-align:center;margin:0;font-weight:700}
.prices-card.blue h3{color:#ffffff}
.prices-card.white h3{color:#1ea5d0}
.prices-card.navy h3{color:#1ea5d0}
.prices-card .psub{text-align:center;font-size:.82rem;margin-top:4px}
.prices-card.blue .psub{color:#ffffff;opacity:.95}
.prices-card.white .psub{color:#16384f}
.prices-card .pdiv{width:100%;height:1px;margin:14px 0 16px}
.prices-card.blue .pdiv{background:rgba(255,255,255,.55)}
.prices-card.white .pdiv{background:#1ea5d0}
.prices-card.navy .pdiv{background:#1ea5d0}
.prices-card ul{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:10px;font-size:.84rem;flex-grow:1}
.prices-card li{display:flex;align-items:flex-start;gap:8px;line-height:1.35}
.prices-card.white li{color:#1ea5d0;font-weight:500}
.prices-card.navy li{color:#1ea5d0;font-weight:500}
.prices-card .pprice{text-align:center;margin-top:auto;padding-top:10px}
.prices-card .pamount{font-size:1.55rem;font-weight:800;letter-spacing:-.01em;display:block}
.prices-card.blue .pamount{color:#ffffff}
.prices-card.white .pamount{color:#1ea5d0}
.prices-card .pcurr{font-size:1.05rem;font-weight:700;display:block}
.prices-card.blue .pcurr{color:#ffffff}
.prices-card.white .pcurr{color:#1ea5d0}
.prices-card .pcustom{color:#1ea5d0;font-size:1.35rem;font-weight:700;line-height:1.3;text-align:center;margin:auto 0;padding:24px 0}
.btn-cotizar{display:inline-block;background-color:#ff6438;color:#ffffff!important;font-weight:700;font-size:.86rem;padding:9px 26px;border-radius:4px;text-decoration:none;letter-spacing:.05em;text-transform:uppercase;margin-top:18px;border:none;cursor:pointer}
.btn-cotizar:hover{opacity:.9}
@media (max-width:1120px){
 .prices-row{grid-template-columns:repeat(2,1fr);max-width:640px;margin-left:auto;margin-right:auto}
 .prices-row-3{grid-template-columns:repeat(2,280px);gap:24px}
}
@media (max-width:620px){
 .prices-row{grid-template-columns:1fr;max-width:320px}
 .prices-row-3{grid-template-columns:1fr;max-width:320px}
}
</style>
</head>

     <li>${pckB}<span>Chile: ~1700 $CLP/km (a evaluar)</span></li>
     <li>${pckB}<span>Extranjero ~2 $USD/km<br>+ se hace desarrollo local, supervisado y puesta en marcha de Remote Water en terreno</span></li>
    </ul>
   </div>
  </div>

  <div class="prices-col">
   <div class="prices-card blue service">
    <div class="picon-wrap">${pIconGears}</div>
    <h3>Plan<br>Mantenimiento</h3>
    <div class="pdiv"></div>
    <ul>
     <li>${pckW}<span>Plan Flexible (por uso):<br>X UF/m3 + x Uf/mes</span></li>
     <li>${pckW}<span>Plan 3 Visitas:<br>900 a 1.200 USD/anual*<br><span style="font-size:.78rem;opacity:.9">(*Depende de Ubicación)</span></span></li>
     <li>${pckW}<span>Plan Correctivo: Visita de diagnóstico y corrección<br>350-500 USD/día*<br><span style="font-size:.78rem;opacity:.9">(*reemplazo de equipos por separado)</span></span></li>
    </ul>
   </div>
  </div>

  <div class="prices-col">
   <div class="prices-card navy service">
    <div class="picon-wrap">${pIconPred}</div>
    <h3>Mantenimiento<br>Predictivo</h3>
    <div class="pdiv"></div>
    <ul>
     <li>${pckC}<span>Ahorre en las visitas correctivas.</span></li>
     <li>${pckC}<span>Alargue la vida de sus activos.</span></li>
     <li>${pckC}<span>Mantenga continuidad de tratamiento.</span></li>
     <li>${pckC}<span>Plan Anual: 60 - 120 USD/mes</span></li>
    </ul>
   </div>
  </div>
 </div>
</div></section>`;

/* ---------- Preguntas Frecuentes ---------- */
const FAQA=[
 "1. ¿Cómo purifica el sistema?",
 "2. ¿Se puede tomar el agua?",
 "3. ¿Es necesario agregar cloro?",
 "4. ¿Puede conectarse a la electricidad?",
 "5. ¿Los reportes se envían si no hay WiFi?",
 "6. ¿Se puede llevar a otro país?",
 "7. ¿Se puede almacenar agua que no se utiliza?",
 "8. ¿Cómo sé si mi agua es de mala calidad?",
 "9. ¿Cómo puedo hacer otras consultas y solicitudes?"
];
const FAQR=[
 "1. ¿Qué tipo de aguas se pueden tratar y reutilizar?",
 "2. ¿Cuál es la diferencia entre Grey Mini y Grey Maxi?",
 "3. ¿Para qué se puede usar el agua gris tratada?",
 "4. ¿Qué tecnología utiliza para filtrar el agua?",
 "5. ¿Requiere romper muros en edificios existentes?",
 "6. ¿Cada cuánto tiempo se cambian los filtros?",
 "7. ¿Se puede aplicar a otro país?",
 "8. ¿Cómo sé si mi agua es apta para re-uso?",
 "9. ¿Cómo puedo hacer otras consultas y solicitudes?"
];
const faqItem=q=>`<details class="card" style="margin-bottom:12px;padding:14px 18px;cursor:pointer"><summary style="font-weight:600">${q}</summary><p style="margin-top:10px;color:var(--mut)">Respuesta a definir próximamente.</p></details>`;

V.faq=()=>`<section><div class="wrap ctr"><h1 style="color:#1ea5d0">Preguntas frecuentes</h1><div class="rule" style="margin:16px auto"></div><p class="sub">Aquí encontrarás las respuestas que estás buscando</p></div><div class="wrap" style="margin-top:30px"><div class="grid g2" style="align-items:start">
 <div><h3 style="text-align:center;margin-bottom:18px">Acceso de Agua</h3><div>${FAQA.map(faqItem).join('')}</div></div>
 <div><h3 style="text-align:center;margin-bottom:18px">Re-uso de Agua</h3><div>${FAQR.map(faqItem).join('')}</div></div>
</div></div></section>`;

/* ---------- Formularios interactivos ---------- */
const Y='x',O='o';
const QS={
reuso:[
 {k:'estado',q:'¿En qué estado se encuentra tu edificación o infraestructura?',o:[['Infraestructura existente en operación'],['Edificación nueva en fase de diseño / obra'],['Remodelación o ampliación mayor'],['No lo sé, necesito asesoría',Y]]},
 {k:'inst',q:'¿Tipo de institución o recinto?',o:[['Colegio / Escuela'],['Universidad / Instituto Profesional'],['Centro Comercial / Mall'],['Complejo Industrial / Faena / Bodegas'],['Edificio Corporativo / Oficinas'],['Otro tipo de institución',O]]},
 {k:'origen',q:'¿De dónde provienen las aguas grises que deseas recolectar y tratar?',o:[['Lavamanos de baños'],['Duchas'],['Lavanderías'],['No lo sé, necesito asesoría',Y]]},
 {k:'uso',q:'¿Para qué utilizarás el agua gris tratada?',o:[['Descarga de inodoros y urinarios sanitarios (WC)'],['Riego de áreas verdes / jardines / Canchas'],['Lavado de pisos, patios o vehículos'],['Uso en procesos industriales / Torres de enfriamiento'],['Otro destino',O]]},
 {k:'plazo',q:'¿Qué tan rápido necesita implementar la solución?',t:1}],
acceso:[
 {k:'fuente',q:'¿Cuál es la fuente del agua que quieres tratar?',o:[['Mar'],['Río'],['Lago'],['Pozo'],['Vertiente'],['Agua reutilizada'],['Otra fuente',O],['No lo sé, necesito asesoría',Y]]},
 {k:'uso',q:'¿Para qué usarás el agua?',o:[['Potable'],['Riego'],['Hidroponía'],['Embotellada'],['Otro uso',O]]},
 {k:'vol',q:'¿Cuál es el consumo diario aproximado?',o:[['Hasta 5 m³/día'],['5 a 50 m³/día'],['Más de 50 m³/día'],['No lo sé, necesito asesoría',Y]]},
 {k:'energia',q:'¿Con qué energía contarás?',o:[['Solar'],['Red eléctrica'],['Mixta'],['No lo sé, necesito asesoría',Y]]},
 {k:'plazo',q:'¿Qué tan rápido necesita implementar la solución?',t:1}],
filtros:[{k:'plazo',q:'¿Qué tan rápido necesitas los filtros?',t:1}]};
const pre=(l,p)=>QS[l].filter(q=>!q.t).map(q=>({...q,k:p+q.k}));
const genQ=()=>{const s=FM.sel.linea||[];const l=[{k:'linea',q:'¿Qué necesitas?',o:[['Acceso de agua'],['Reuso de agua'],['No lo sé, necesito asesoría',Y]]}];if(s.some(t=>t.startsWith('Acceso')))l.push(...pre('acceso','a_'));if(s.some(t=>t.startsWith('Reuso')))l.push(...pre('reuso','r_'));l.push({k:'plazo',q:'¿Qué tan rápido necesita implementar la solución?',t:1});return l};
const getQ=()=>FM.line=='general'?genQ():QS[FM.line];
const CF=[['correo','Correo',1,'email'],['nombre','Nombre',0],['apellidos','Apellidos',0],['tel','Número de teléfono',1,'tel'],['pais','País/región',0],['ciudad','Ciudad',0],['empresa','Empresa / Institución',1],['cargo','Cargo / Rol en la organización (ej: Administrador de Edificio, Jefe de Operaciones, Arquitecto/Proyectista, Director)',0],['motivo','¿Por qué nos contacta?',1]];
const FM={key:'',st:0,d:{},sel:{},oth:{},txt:{}};
function resetForm(key){const [mode,line]=key.split('-');Object.assign(FM,{key,mode,line,st:0,d:{motivo:mode=='asesoria'?'Asesoría':'Cotización'},sel:{},oth:{},txt:{}})}
const answered=()=>getQ().filter(q=>q.t?(FM.txt[q.k]||'').trim():(FM.sel[q.k]||[]).length).length;

V.form=()=>{
 const L=getQ(),st=FM.st;
 const name={reuso:'Re-uso de agua',acceso:'Acceso de agua',filtros:'filtros'}[FM.line];
 const head=FM.line=='general'?'Cuéntanos sobre tu proyecto':FM.line=='filtros'?'Cuéntanos sobre tu pedido de filtros':`Cuéntanos sobre tu necesidad de ${name}`;
 const sub=FM.mode=='asesoria'?'Así podremos asesorarte según tus requerimientos':'Así podremos ejecutar una cotización exacta a tus requerimientos';
 const prog=`<div class="prog"><i class="d"></i><i class="${st?'d':''}"></i></div>`;
 let body;
 if(!st){
  body=CF.map(([id,l,r,ty])=>`<label for="c_${id}">${esc(l)}${r?'<span class="rq">*</span>':''}</label><input type="${ty||'text'}" id="c_${id}" data-fld="${id}" value="${esc(FM.d[id]||'')}" ${id=='correo'?'autocomplete="email"':''}>`).join('')+'<div class="ferr" id="ferr" role="alert"></div>';
 }else{
  const cart=FM.line=='filtros'?`<div class="note" style="margin-top:20px"><b>Tu carrito:</b> ${Object.keys(CART).length?Object.keys(CART).map(i=>esc(FILT.find(f=>f.id==i).n)+' × '+CART[i]).join(' · '):'vacío. Agrega filtros desde la sección Filtros.'}</div>`:'';
  body=cart+L.map(q=>{
   if(q.t)return `<fieldset><legend>${q.q}</legend><input type="text" data-txt="${q.k}" value="${esc(FM.txt[q.k]||'')}" aria-label="${esc(q.q)}"></fieldset>`;
   const s=FM.sel[q.k]||[];
   return `<fieldset data-k="${q.k}"><legend>${q.q}</legend>${q.o.map(([t,f])=>`<label class="ck"><input type="checkbox" value="${esc(t)}" data-f="${f||''}" ${s.includes(t)?'checked':''}>${t}</label>${f==O?`<input type="text" class="oth ${s.includes(t)?'on':''}" data-oth="${q.k}" placeholder="Cuéntanos más" value="${esc(FM.oth[q.k]||'')}" aria-label="${esc(t)}">`:''}`).join('')}</fieldset>`}).join('')+`<span class="pc" id="pc" aria-live="polite">${answered()} de ${L.length} preguntas respondidas</span><div class="ferr" id="ferr" role="alert"></div>`;
 }
 return `<section><div class="wrap" style="max-width:780px"><div class="eyebrow">${FM.mode=='asesoria'?'Asesoría':'Cotización'} · ${FM.line=='general'?'Tu proyecto':FM.line=='filtros'?'Filtros':FM.line=='reuso'?'Reuso de agua':'Acceso de agua'} · Paso ${st+1} de 2</div>${prog}<h2 style="margin-top:6px">${head}</h2><p class="sub">${sub}</p>${body}<div class="row"><button class="btn ghost" id="bk" ${st?'':'style="visibility:hidden"'}>← Atrás</button><button class="btn teal" id="nx">${st?'Enviar solicitud':'Continuar →'}</button></div></div></section>`;
};
V.form.after=()=>{
 $('#bk').onclick=()=>{FM.st=0;draw();scrollTo(0,0)};
 $('#nx').onclick=()=>{
  if(!FM.st){
   const miss=CF.filter(c=>c[2]&&!(FM.d[c[0]]||'').trim());
   document.querySelectorAll('[data-fld]').forEach(i=>i.classList.toggle('bad',miss.some(c=>c[0]==i.dataset.fld)));
   if(miss.length){$('#ferr').textContent='Completa los campos obligatorios (*).';return}
   if(!/^\S+@\S+\.\S+$/.test(FM.d.correo.trim())){$('#c_correo').classList.add('bad');$('#ferr').textContent='Ingresa un correo válido.';return}
   FM.st=1;draw();scrollTo(0,0);return}
  done();
 };
};
function done(){
 const L=getQ();
 const rows=CF.filter(c=>(FM.d[c[0]]||'').trim()).map(c=>`<li><b>${esc(c[1].split(' (')[0])}:</b> ${esc(FM.d[c[0]])}</li>`).join('')
  +L.map(q=>{let v;if(q.t)v=(FM.txt[q.k]||'').trim();else{v=(FM.sel[q.k]||[]).map(t=>{const f=q.o.find(o=>o[0]==t);return f&&f[1]==O&&FM.oth[q.k]?t+' ('+FM.oth[q.k]+')':t}).join(', ')}return v?`<li><b>${esc(q.q)}</b><br>${esc(v)}</li>`:''}).join('')
  +(FM.line=='filtros'&&Object.keys(CART).length?`<li><b>Filtros:</b> ${Object.keys(CART).map(i=>esc(FILT.find(f=>f.id==i).n)+' × '+CART[i]).join(' · ')}</li>`:'');
 const nm=esc(FM.d.nombre||'');
 const asesoria=FM.mode=='asesoria';
 $('#app').innerHTML=`<section><div class="wrap" style="max-width:680px;text-align:center"><div style="color:var(--teal);width:64px;margin:0 auto">${ic('ok')}</div><h1>¡Solicitud enviada!</h1><p class="sub">${nm?'Gracias, '+nm+'. ':'Gracias. '}Nuestro equipo te contactará ${asesoria?'para asesorarte en tu proyecto':'con una cotización a tu medida'}.</p><ul class="sum">${rows}</ul><a class="btn teal" href="#inicio">Volver al inicio</a></div></section>`;
 if(FM.line=='filtros'){for(const k in CART)delete CART[k];refreshCart()}
 scrollTo(0,0);
}

/* ---------- Router ---------- */
function draw(){
 const raw=location.hash.slice(1)||'inicio';
 const isForm=/^(cotizar|asesoria)-(reuso|acceso|filtros|general)$/.test(raw);
 let key=isForm?'form':(V[raw]&&raw!='form'?raw:'inicio');
 if(isForm&&FM.key!=raw)resetForm(raw);
 const act0=isForm?FM.line:key;const act=(act0=='filtros')?'reuso':(act0=='general'?'inicio':act0);
 $('#nav').innerHTML=nav.map(([k,t])=>`<a href="#${k}" class="${k==act?'on':''}" ${k==act?'aria-current="page"':''}>${t}</a>`).join('');
 $('#app').innerHTML=V[key]();
 if(V[key].after)V[key].after();
 refreshCart();
}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(/^(cotizar|asesoria)-/.test(h))FM.key='';draw();scrollTo(0,0)});

/* ---------- Eventos globales ---------- */
const dlg=$('#cartdlg');
$('#cartbtn').onclick=()=>{refreshCart();dlg.showModal()};
$('#cx').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg||e.target.id=='cclose'||e.target.id=='cquote')dlg.close()});
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 const d=t.dataset;
 if(d.q){const o=t.parentElement.querySelector('output');o.textContent=Math.min(99,Math.max(1,(+o.textContent)+(+d.q)))}
 if(d.add){const c=t.closest('.fcard'),o=c.querySelector('output');CART[d.add]=(CART[d.add]||0)+(+o.textContent);o.textContent='1';refreshCart()}
 if(d.cq){const n=(CART[d.cq]||0)+(+d.d);if(n<1)delete CART[d.cq];else CART[d.cq]=Math.min(99,n);refreshCart()}
 if(d.rm){delete CART[d.rm];refreshCart()}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.fld){FM.d[t.dataset.fld]=t.value;t.classList.remove('bad')}
 if(t.dataset.oth)FM.oth[t.dataset.oth]=t.value;
 if(t.dataset.txt){FM.txt[t.dataset.txt]=t.value;pc()}
});
document.addEventListener('change',e=>{const t=e.target;if(!t.matches('.ck input'))return;
 const fs=t.closest('fieldset'),k=fs.dataset.k,boxes=[...fs.querySelectorAll('.ck input')];
 if(t.checked)boxes.forEach(b=>{if(b!==t&&((t.dataset.f=='x')||(b.dataset.f=='x')))b.checked=false});
 FM.sel[k]=boxes.filter(b=>b.checked).map(b=>b.value);
 fs.querySelectorAll('.oth').forEach(i=>{const b=i.previousElementSibling.querySelector('input');i.classList.toggle('on',b.checked);if(b.checked&&!i.dataset.fo){i.dataset.fo=1;i.focus()}if(!b.checked)i.dataset.fo=''});
 pc();if(k=='linea'){const y=scrollY;draw();scrollTo(0,y)}
});
function pc(){const p=$('#pc');if(p)p.textContent=answered()+' de '+getQ().length+' preguntas respondidas'}
draw();
</script>
</body>
</html>
